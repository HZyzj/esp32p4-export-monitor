    component_hash: af9d7a914a5682933224358f79f1120d55e11f054eda0d015890718d50652252
    dependencies:
    - matches:
      - if: $CONFIG{ESP_BOARD_DEV_BUTTON_SUPPORT} == True
      name: espressif/button
      registry_url: https://components.espressif.com
      require: private
      version: ^4.1.4
    - name: espressif/esp_boards
      registry_url: https://components.espressif.com
      require: private
      version: ~0.7.3
    - matches:
      - if: $CONFIG{ESP_BOARD_DEV_AUDIO_CODEC_SUPPORT} == True
      name: espressif/esp_codec_dev
      registry_url: https://components.espressif.com
      require: private
      version: ^2.0.0-beta4
