      name: espressif/esp_lcd_panel_io_additions
      registry_url: https://components.espressif.com
      require: private
      version: ^1.0.0
    - matches:
      - if: $CONFIG{ESP_BOARD_DEV_LCD_TOUCH_SUPPORT} == True
      name: espressif/esp_lcd_touch
