# V1.6 user guide: 7-inch 1024x600 kit, GPIO27 -> RST_LCD and GPIO26 -> PWM.
# Retain the kit EK79007 driver's timing and DSI/LDO settings from the pinned base.
devices:
  - name: ethernet
    gen_skip: true

  - name: boot_button
    gen_skip: true

  - name: fs_sdcard
    gen_skip: true

  - name: camera
    gen_skip: true

  - name: display_lcd
    config:
      reset_gpio_num: 27
      reset_active_high: 0
      bits_per_pixel: 16
      dpi_config:
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        video_timing:
          h_size: 1024
          v_size: 600

peripherals:
  - name: gpio_boot_button
    gen_skip: true

  - name: ledc_backlight
    config:
      gpio_num: 26
